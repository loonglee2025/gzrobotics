name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check no tracking scripts
        run: |
          if grep -rn -E "gtag|google-analytics|analytics\.js|umami|plausible" src public; then
            echo "::error::检测到统计/追踪脚本，站点合规要求禁止引入。"
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
