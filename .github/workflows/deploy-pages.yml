name: Deploy Pages (gzrobotics.org)

# 正式站：自定义域 https://gzrobotics.org（GitHub Pages + CNAME）
# 构建用根路径（base=/），并写入 CNAME 文件；GitHub 会自动签发 Let's Encrypt 证书。
# 注意：若未绑定自定义域、需要项目页子路径（/gzrobotics/）形态，
# 则改用 `DEPLOY_TARGET=gh-pages npm run build` 且不要写 CNAME。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  build:
    name: Build (custom domain, base=/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Write CNAME (gzrobotics.org)
        run: echo "gzrobotics.org" > dist/CNAME

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
